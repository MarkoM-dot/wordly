site_name: Wordly
site_description: Wordly python package documentation
site_author: Marko Marić
repo_name: MarkoM-dot/wordly
repo_url: https://github.com/MarkoM-dot/wordly
nav:
  - index.md
  - tutorials.md
  - How-To Guides:
    - how-to-guides/index.md
  - Commands:
    - words: commands/words.md
  - reference.md
  - explanation.md

theme:
  locale: en
  name: "material"
  palette:
    primary: deep purple
    accent: yellow

plugins:
  - search
  - mkdocstrings
